name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-client_management-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      TOKEN: ${{ secrets.TOKEN }}
      ROOT_USERNAME: ${{ secrets.ROOT_USERNAME }}
      ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: frappe
        options: >-
          --health-cmd="pg_isready -U $$POSTGRES_USER"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize Frappe Bench
        run: |
          bench init --skip-assets ./frappe-bench
        working-directory: ${{ github.workspace }}

      - name: Get app client_management
        run: |
          bench get-app client_management $GITHUB_WORKSPACE
        working-directory: ${{ github.workspace }}/frappe-bench

      - name: Install app requirements
        run: |
          pip install -r apps/client_management/requirements.txt
        working-directory: ${{ github.workspace }}/frappe-bench

      - name: Setup bench requirements for dev
        run: bench setup requirements --dev
        working-directory: ${{ github.workspace }}/frappe-bench

      - name: Create new site
        run: |
          bench new-site test_site \
            --db-type postgres \
            --db-host postgres \
            --db-root-username $POSTGRES_USER \
            --db-root-password $POSTGRES_PASSWORD \
            --admin-password $ADMIN_PASSWORD \
            --no-mariadb-socket
        working-directory: ${{ github.workspace }}/frappe-bench
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Install client_management app on site
        run: bench --site test_site install-app client_management
        working-directory: ${{ github.workspace }}/frappe-bench

      - name: Build assets
        run: bench build
        working-directory: ${{ github.workspace }}/frappe-bench

      - name: Run tests
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app client_management
        working-directory: ${{ github.workspace }}/frappe-bench
        env:
          TYPE: server
